<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the WKWebView content extend fully under the
      notch/status bar and home indicator on iOS instead of leaving that
      area unaccounted for — without it, env(safe-area-inset-*) below has
      nothing to measure and fixed chrome like .topbar renders flush against
      the very edge, colliding with the status bar.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141C2E" />
    <!--
      Vite fingerprints the JS and CSS filenames, so those cache forever
      safely — but this file names them, and a stale copy of it keeps serving
      an old build long after a deploy. That has repeatedly looked like "the
      feature didn't ship" on a phone. Ask for a revalidation each load; the
      document is ~1KB, and everything it references is still cached.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <title>Student Driver Log</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <!--
      iOS Safari's "Add to Home Screen" doesn't read the web app manifest's
      icons at all — it needs this explicit link, and the two
      apple-mobile-web-app tags below, or the installed icon falls back to a
      screenshot of the page and it launches inside Safari's chrome instead
      of standalone.
    -->
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
